<button id="darkModeBtn" class="dark-mode-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode">❨</button>

<style>
    .dark-mode-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 1000;
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: inherit;
    }

    body.dark-mode {
        background-color: #000000;
        color: #f5f5f5;
    }

    body.dark-mode h1,
    body.dark-mode h2 {
        color: #f5f5f5;
    }

    body.dark-mode a {
        color: #f5f5f5;
    }

    body.dark-mode .accent {
        color: #5477ff; /* brightened version of the site's $accent for contrast on black */
    }
</style>

<script>
    function applyDarkMode(isDark) {
        document.body.classList.toggle('dark-mode', isDark);
        const btn = document.getElementById('darkModeBtn');
        if (btn) {
            btn.textContent = isDark ? '☉' : '❨'; // sun to go light, moon to go dark
        }
    }

    function toggleDarkMode() {
        const isDark = !document.body.classList.contains('dark-mode');
        applyDarkMode(isDark);
        localStorage.setItem('darkMode', isDark ? '1' : '0');
    }

    // Restore the visitor's last choice on page load
    applyDarkMode(localStorage.getItem('darkMode') === '1');
</script>
