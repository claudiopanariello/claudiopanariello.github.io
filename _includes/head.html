<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="author" content="{{ site.author }}">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>


  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  {% if page.title %}
    <meta property="og:type" content="article">
  {% else %}
    <meta property="og:type" content="website">
  {% endif %}

  {% if page.date %}
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  {% endif %}

  {% if site.twitter_username %}
    <meta name="twitter:site" content="@{{ site.twitter_username }}">
  {% endif %}

  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link href="https://fonts.googleapis.com/css?family=Inconsolata:400,700|Libre+Baskerville:400,400i,700" rel="stylesheet">

<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="{{ "/assets/yefeme.css" | relative_url }}">

    <style>

        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 1000;
        }

        .glitch-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 1000;
            animation: indicator-flicker 0.5s infinite;
        }

        @keyframes indicator-flicker {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }

        .warning {
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
            animation: warning-pulse 0.3s infinite;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        @keyframes warning-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .quote {
            font-style: italic;
            font-size: 1.1rem;
            text-align: center;
            margin: 40px 0;
            padding: 20px;
            border-left: 4px solid #ff0000;
            background: rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 2;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.9rem;
            color: #666;
            position: relative;
            z-index: 2;
        }

        /* Immediate glitch effects */
        .micro-glitch {
            animation: micro-shake 0.1s infinite;
            position: relative;
        }

        @keyframes micro-shake {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(-0.5px, 0.5px); }
            50% { transform: translate(0.5px, -0.5px); }
            75% { transform: translate(-0.5px, -0.5px); }
        }

        /* Intense RGB separation */
        .rgb-split {
            position: relative;
            animation: rgb-chaos 0.2s infinite;
        }

        .rgb-split::before,
        .rgb-split::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            mix-blend-mode: screen;
        }

        .rgb-split::before {
            color: #ff0000;
            animation: rgb-drift-1 0.3s infinite;
            z-index: -1;
        }

        .rgb-split::after {
            color: #00ff00;
            animation: rgb-drift-2 0.4s infinite;
            z-index: -2;
        }

        @keyframes rgb-chaos {
            0% { color: #0000ff; }
            33% { color: #ff0000; }
            66% { color: #00ff00; }
            100% { color: #0000ff; }
        }

        @keyframes rgb-drift-1 {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 1px); }
            50% { transform: translate(2px, -1px); }
            75% { transform: translate(-1px, -2px); }
            100% { transform: translate(1px, 2px); }
        }

        @keyframes rgb-drift-2 {
            0% { transform: translate(0, 0); }
            20% { transform: translate(1px, -1px); }
            40% { transform: translate(-2px, 2px); }
            60% { transform: translate(2px, 1px); }
            80% { transform: translate(-1px, -2px); }
            100% { transform: translate(0, 0); }
        }

        /* Extreme text corruption */
        .corrupted-text {
            position: relative;
            animation: text-corruption 0.5s infinite;
        }

        @keyframes text-corruption {
            0% { filter: hue-rotate(0deg) saturate(1); }
            25% { filter: hue-rotate(90deg) saturate(2); }
            50% { filter: hue-rotate(180deg) saturate(0.5); }
            75% { filter: hue-rotate(270deg) saturate(1.5); }
            100% { filter: hue-rotate(360deg) saturate(1); }
        }

        /* Violent shaking */
        .violent-shake {
            animation: violent-tremor 0.05s infinite;
        }

        @keyframes violent-tremor {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-3px, 2px) rotate(1deg); }
            20% { transform: translate(3px, -2px) rotate(-1deg); }
            30% { transform: translate(-2px, -3px) rotate(1deg); }
            40% { transform: translate(2px, 3px) rotate(-1deg); }
            50% { transform: translate(-3px, -2px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(-1deg); }
            70% { transform: translate(-2px, 3px) rotate(1deg); }
            80% { transform: translate(2px, -3px) rotate(-1deg); }
            90% { transform: translate(-3px, 3px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Chromatic aberration */
        .chromatic {
            position: relative;
            filter: blur(calc(var(--chaos-level) * 2px));
        }

        .chromatic::before,
        .chromatic::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .chromatic::before {
            color: #ff0000;
            transform: translateX(calc(var(--chromatic-offset) * -2px));
            opacity: 0.7;
        }

        .chromatic::after {
            color: #0000ff;
            transform: translateX(calc(var(--chromatic-offset) * 2px));
            opacity: 0.7;
        }

        /* Screen distortion */
        .distorted {
            transform: 
                scaleX(calc(1 + var(--distortion-scale) * 0.1)) 
                scaleY(calc(1 + var(--distortion-scale) * 0.05))
                skewX(calc(var(--distortion-scale) * 5deg))
                skewY(calc(var(--distortion-scale) * 2deg));
            filter: 
                contrast(calc(1 + var(--distortion-scale) * 0.5))
                brightness(calc(1 + var(--distortion-scale) * 0.3))
                hue-rotate(calc(var(--distortion-scale) * 180deg));
        }

        /* Extreme static overlay */
        .static-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255,0,0,0.1) 1px, transparent 1px),
                radial-gradient(circle at 80% 80%, rgba(0,255,0,0.1) 1px, transparent 1px),
                radial-gradient(circle at 40% 60%, rgba(0,0,255,0.1) 1px, transparent 1px),
                radial-gradient(circle at 70% 30%, rgba(255,255,0,0.1) 1px, transparent 1px);
            background-size: 5px 5px, 7px 7px, 3px 3px, 9px 9px;
            animation: static-chaos 0.1s infinite;
            pointer-events: none;
            opacity: var(--static-opacity);
            z-index: 999;
        }

        @keyframes static-chaos {
            0% { 
                background-position: 0 0, 0 0, 0 0, 0 0;
                filter: invert(0);
            }
            25% { 
                background-position: -2px 1px, 1px -2px, 2px 2px, -1px 1px;
                filter: invert(0.1);
            }
            50% { 
                background-position: 1px -1px, -2px 2px, -1px -1px, 2px -2px;
                filter: invert(0.2);
            }
            75% { 
                background-position: -1px 2px, 2px 1px, 1px -2px, -2px -1px;
                filter: invert(0.1);
            }
            100% { 
                background-position: 0 0, 0 0, 0 0, 0 0;
                filter: invert(0);
            }
        }

        /* Fragmented characters */
        .fragmented {
            position: relative;
        }

        .fragmented .char {
            display: inline-block;
            animation: char-chaos 0.3s infinite;
        }

        @keyframes char-chaos {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(var(--char-x, 0), var(--char-y, 0)) rotate(var(--char-rot, 0deg)) scale(var(--char-scale, 1)); }
            50% { transform: translate(calc(var(--char-x, 0) * -1), calc(var(--char-y, 0) * -1)) rotate(calc(var(--char-rot, 0deg) * -1)) scale(calc(var(--char-scale, 1) * 0.8)); }
            75% { transform: translate(calc(var(--char-x, 0) * 0.5), calc(var(--char-y, 0) * 0.5)) rotate(calc(var(--char-rot, 0deg) * 0.5)) scale(calc(var(--char-scale, 1) * 1.2)); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        /* Scan lines */
        .scan-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 0, 0.1) 2px,
                rgba(0, 255, 0, 0.1) 4px
            );
            animation: scan-movement 0.1s infinite;
            pointer-events: none;
            opacity: var(--static-opacity);
            z-index: 998;
        }

        @keyframes scan-movement {
            0% { transform: translateY(0px); }
            100% { transform: translateY(4px); }
        }

        /* Extreme chaos mode */
        .chaos-mode {
            animation: 
                violent-tremor 0.05s infinite,
                rgb-chaos 0.2s infinite,
                text-corruption 0.3s infinite;
            filter: 
                blur(2px) 
                contrast(2) 
                brightness(1.5) 
                hue-rotate(180deg) 
                saturate(3);
        }
        /* COLLATZ CONJECTURE elements */
        #canvas {
            display: block;
            background: #ffffff;
            transition: background-color 0.5s ease;
        }
        
        .collatz-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
            transition: opacity 0.5s ease;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #000000;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #000000;
            z-index: 1000;
            opacity: 0.3;
            transition: opacity 0.3s ease, background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease;
        }
        
        .controls:hover {
            opacity: 1;
        }
        
        .controls.dark-mode {
            background: rgba(0, 0, 0, 0.8);
            border-color: #ffffff;
            color: #ffffff;
        }
        
        button {
            background: rgba(0, 0, 0, 0.1);
            color: #000000;
            border: 1px solid #000000;
            padding: 5px 10px;
            margin: 2px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: background-color 0.3s ease, color 0.5s ease, border-color 0.5s ease;
        }
        
        button:hover {
            background: rgba(0, 0, 0, 0.2);
        }
        
        .controls.dark-mode button {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: #ffffff;
        }
        
        .controls.dark-mode button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .audio-controls {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #000000;
            transition: border-color 0.5s ease;
        }
        
        .controls.dark-mode .audio-controls {
            border-color: #ffffff;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }
        
        .volume-control label {
            margin-right: 5px;
            font-size: 10px;
        }
        
        .volume-control input {
            width: 60px;
        }
        
        .opacity-control {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }
        
        .opacity-control label {
            margin-right: 5px;
            font-size: 10px;
        }
        
        .opacity-control input {
            width: 60px;
        }
        
        body.dark-mode {
            background: #000000;
        }
        
        body.dark-mode #canvas {
            background: #000000;
        }
    </style>
</head>
